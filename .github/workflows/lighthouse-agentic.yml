name: Lighthouse Agentic Browsing

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  agentic-lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Setup Chrome (latest stable)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Run agentic Lighthouse audit
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: npm run agentic:lighthouse

      - name: Parse agentic score
        run: npm run agentic:score
        continue-on-error: true

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-agentic-report
          path: lighthouse-agentic.json
          if-no-files-found: ignore
